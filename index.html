<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanjida Maisha — Portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Cinematic Multi-Layer Page Transition Curtain -->
    <div class="page-transition-curtain" id="page-transition-curtain" aria-hidden="true">
        <div class="curtain-layer-1"></div>
        <div class="curtain-layer-2">
            <span class="curtain-monogram">SANJIDA MAISHA • PORTFOLIO</span>
        </div>
    </div>

    <!-- =====================================================================
         1. FRONT PAGE (HOME): SHADED ASH-GREEN STUDIO HERO
         ===================================================================== -->
    <section class="welcome-screen" id="welcome-screen">

        <!-- Top Bar: Option Bar at the Top-Left Corner + Brand -->
        <header class="hero-top-nav">
            <!-- Top-Left Option Bar containing all 6 options -->
            <div class="option-bar-wrapper">
                <nav class="unified-option-bar" aria-label="Main Option Bar">
                    <button class="option-bar-item active" data-target="home">Home</button>
                    <button class="option-bar-item" data-target="sec-student-intro">Student info</button>
                    <button class="option-bar-item" data-target="sec-achievements">Achievement</button>
                    <button class="option-bar-item" data-target="sec-passions">Passions</button>
                    <button class="option-bar-item" data-target="sec-projects">Works</button>
                    <button class="option-bar-item" data-target="sec-contact">Contact details</button>
                </nav>
            </div>

            <!-- Top-Right Name & Portfolio Tag -->
            <div class="header-brand-portion">
                <span class="brand-name-keep" id="hero-brand-fullname">SANJIDA MAISHA</span>
                <span class="brand-divider">/</span>
                <span class="brand-portfolio-word">PORTFOLIO</span>
            </div>
        </header>

        <!-- Main Center Stage: Giant Split "SANJIDA" & "MAISHA" + "PORTFOLIO" -->
        <div class="hero-stage" id="hero-stage">

            <!-- Subtle Ambient Center Studio Ring / Accent -->
            <div class="hero-studio-orb" aria-hidden="true"></div>

            <!-- Left Giant First Name ("SANJIDA") -->
            <div class="hero-name-left" id="hero-first-name">
                SANJIDA
            </div>

            <!-- Mid-Right Portion: "PORTFOLIO" -->
            <div class="hero-role-box" id="hero-role-box">
                <div class="hero-portfolio-title">PORTFOLIO</div>
                <div class="hero-portfolio-sub" id="hero-role-2">CSE Student • Achiever • Creator</div>
            </div>

            <!-- Lower-Right Giant Last Name ("MAISHA") -->
            <div class="hero-name-right" id="hero-last-name">
                M<span class="stylized-letter">A</span>ISHA
            </div>

        </div>
    </section>

    <!-- =====================================================================
         2. INNER PORTFOLIO PAGES (Shaded Ash-Green Studio Aesthetic)
         ===================================================================== -->
    <div class="main-portfolio-wrapper" id="main-portfolio-wrapper">

        <!-- Sticky Top Header:
             - Option Bar where the Front Page option is
             - "SANJIDA MAISHA" kept as it is + "PORTFOLIO" -->
        <nav class="sticky-top-nav" aria-label="Inner Page Navigation">
            <div class="inner-nav-left">
                <!-- Option Bar where the Front Page option is -->
                <div class="inner-option-dropdown" id="inner-option-dropdown">
                    <button class="option-bar-toggle" id="btn-toggle-option-bar" aria-expanded="false">
                        <span>☰ Options</span>
                        <span class="chevron-icon">▾</span>
                    </button>
                    <div class="option-bar-menu" id="option-bar-menu">
                        <button class="option-menu-link" data-target="home">Home</button>
                        <button class="option-menu-link" data-target="sec-student-intro">Student info</button>
                        <button class="option-menu-link" data-target="sec-achievements">Achievement</button>
                        <button class="option-menu-link" data-target="sec-passions">Passions</button>
                        <button class="option-menu-link" data-target="sec-projects">Works</button>
                        <button class="option-menu-link" data-target="sec-contact">Contact details</button>
                    </div>
                </div>
            </div>

            <!-- Kept Name "SANJIDA MAISHA" as it is now + "PORTFOLIO" written in that portion -->
            <div class="inner-nav-brand-portion">
                <span class="nav-brand-monogram" id="inner-brand-fullname">SANJIDA MAISHA</span>
                <span class="brand-divider">/</span>
                <span class="nav-portfolio-label">PORTFOLIO</span>
            </div>
        </nav>

        <!-- Shaded Studio Sections -->
        <main class="studio-sections-container">

            <!-- SECTION 01: STUDENT INFO -->
            <section class="studio-section-card reveal-block" id="sec-student-intro"></section>

            <!-- SECTION 02: ACHIEVEMENT -->
            <section class="studio-section-card reveal-block" id="sec-achievements"></section>

            <!-- SECTION 03: PASSIONS -->
            <section class="studio-section-card reveal-block" id="sec-passions"></section>

            <!-- SECTION 04: WORKS -->
            <section class="studio-section-card reveal-block" id="sec-projects"></section>

            <!-- SECTION 05: CONTACT DETAILS -->
            <section class="studio-section-card reveal-block" id="sec-contact"></section>

        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
